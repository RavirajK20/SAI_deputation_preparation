  {n:'"The Federation"', r:'Institution (generic)', d:'A stand-in for whichever National Sports Federation governs Arjun\'s sport — deliberately unnamed so no real federation\'s conduct is implied.'},
  {n:'Sunita Marandi', r:'Fellow athlete (javelin)', d:'At the same district meet as Arjun. Not picked for NSTC — her path runs through a Khelo India Centre instead, showing that scheme as a parallel door into the system.'},

const CHAPTERS = [
{
  id:'ch0', title:'The Cast & The Map', motif:null,
  sections:[
    {type:'scene', html:`
      <div class="chnum">Prologue</div>
      <h2>Before We Begin</h2>
      <p class="char">A note before the story starts.</p>
      <p>This is a made-up story about a made-up runner. Every character in it — Arjun, Meena, Vikram, Ritu, D.K. Ramesh — is fictional. But every institution they walk into, every rule they follow, every rupee that moves, and every office that signs off is real, and drawn from the same verified material as the rest of this preparation project.</p>
      <p>Read it the way you'd read a well-made documentary drama: enjoy the story, but trust the institutional facts as facts. Wherever the story invents something for convenience — a name, a date, a specific number — it's flagged <span class="tag tag-fict">FICTIONAL</span>. Wherever it states how the system actually works, it's flagged <span class="tag tag-fact">OFFICIAL FACT</span>, <span class="tag tag-parl">PARLIAMENTARY</span>, or <span class="tag tag-inf">INFERENCE</span> if it's a reasonable but unconfirmed connection.</p>
      <p>Two threads run through the whole story. One is <b>Arjun's</b> — follow the athlete. The other is <b>Ritu's</b> — an Assistant Director at SAI, and the character who turns eleven generic vacancy-circular duties into things you'll actually watch someone do.</p>
      <p>You can read chapter by chapter, in order — or, from the home screen, switch to the <b>Campus Map</b> and jump straight to whichever institution you want to understand, which will take you to the chapter where it actually comes up.</p>
    `},
    {type:'cast'},
    {type:'takeaway', html:`<div class="lbl">Why this exists</div>By the end, you should be able to take any real interview question — "who funds Khelo India," "where does an NSF fit," "what can an AD actually decide" — and answer it by picturing a scene in this story rather than recalling an isolated fact.`}
  ]
},
{
  id:'ch1', title:'A Time at the District Meet', motif:'FOLLOW THE ATHLETE',
  sections:[
    {type:'scene', html:`
      <div class="chnum">Chapter 1</div>
      <h2>A Time at the District Meet</h2>
      <p class="char">Jharkhand, a district athletics meet. Fictional setting, fictional event.</p>
      <p>Arjun Toppo ran the 800 metres the way he always did — too fast for the first lap, and somehow still fastest at the end. His school didn't have a proper track. He trained on a flattened stretch of red mud behind the football field, timed by his PE teacher's phone. When the results were called, his time was good enough that Meena Ekka, who had seen three hundred district meets and rarely got excited, wrote his name down twice — once for the school record book, and once on a form she'd been given at a teachers' briefing two months earlier.</p>
      <p>The form was for the <b>National Sports Talent Contest</b> — <span class="tag tag-fact">OFFICIAL FACT</span> a real SAI scheme that scouts talent directly from schools, in Arjun's age bracket. Meena didn't fully understand the acronym chain that followed — NSTC, STC, SAI — she just knew that filling out the form was the only door she could open for a boy who trained on red mud with no coach.</p>
    `},
    {type:'lesson', html:`
      <div class="lbl">What Just Happened <span class="tag tag-fact">Official Fact</span></div>
      <h4>The System's First Door: NSTC</h4>
      <p>The National Sports Talent Contest (NSTC) is SAI's school-based scouting mechanism, aimed at the 8–14 age group. It exists specifically because talent like Arjun's — real, but with no structured pathway around it — needs a formal entry point into the system, not just a lucky scout.</p>
      <p>This is the first rung of a four-stage pipeline you'll see the rest of the story build on: <b>NSTC (scout) → STC (develop) → NCOE (specialise) → TOPS (elite support)</b>. Each stage is run differently, funded differently, and staffed differently — which is exactly why an administrator, not just a coach, is needed to keep athletes moving between them.</p>
    `},
    {type:'diagram', svg:`
      <svg viewBox="0 0 700 120" style="width:100%;">
        <circle cx="60" cy="60" r="30" fill="var(--c-prog)"/><text x="60" y="65" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Arjun</text>
        <line x1="90" y1="60" x2="180" y2="60" stroke="var(--gold)" stroke-width="2.5" marker-end="url(#a1)"/>
        <rect x="180" y="35" width="150" height="50" rx="6" fill="var(--c-sai)"/><text x="255" y="65" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">NSTC trial</text>
        <line x1="330" y1="60" x2="420" y2="60" stroke="var(--gold)" stroke-width="2.5" marker-end="url(#a1)" stroke-dasharray="4 3"/>
        <text x="375" y="45" text-anchor="middle" fill="#9AA3AD" font-size="9">next chapter</text>
        <rect x="420" y="35" width="150" height="50" rx="6" fill="#333"/><text x="495" y="65" text-anchor="middle" fill="#9AA3AD" font-size="11">STC?</text>
        <defs><marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--gold)"/></marker></defs>
      </svg>`, caption:'One trial. One form. The first institutional door in a long chain.'}
  ]
},
{
  id:'ch1b', title:'The Other Door', motif:'FOLLOW THE ATHLETE',
  sections:[
    {type:'scene', html:`
      <div class="chnum">Chapter 1B</div>
      <h2>The Other Door</h2>
      <p class="char">The same district meet. A javelin throw, a different name on a different list.</p>
      <p><span class="tag tag-fict">Fictional character</span> Sunita Marandi threw the javelin that afternoon, two events after Arjun's race. She wasn't in Meena's age bracket for NSTC — she'd turned fifteen that spring, past the scheme's usual scouting window — so her name went onto a different list entirely: one the State Sports Department maintained for its <b>Khelo India Centre</b> in the block town, twenty minutes from her village.</p>
      <p><span class="tag tag-fact">Official fact</span> A Khelo India Centre (KIC) is not the same thing as an SAI Training Centre. KICs are part of the Khelo India scheme — funded and largely administered through the State, with Central support — and they exist in far greater numbers, closer to where athletes actually live, precisely to catch talent that a centralised SAI scheme like NSTC might miss on age, timing, or geography alone.</p>
      <p>Sunita trained at the KIC for two years under a State-appointed coach. Her technique improved enough that, at seventeen, she was moved up — not to an SAI NCOE, but to a <b>Khelo India State Centre of Excellence (KISCE)</b>, a more advanced tier of the same Khelo India scheme, still State-administered, still distinct from SAI's own ladder.</p>
      <p><span class="tag tag-illus">Illustrative scenario</span> It was at a State-level meet that Sunita and Arjun's paths crossed again, years after the district meet neither of them remembered clearly. He was NCOE by then; she was KISCE. Different ladders, same government interest in not losing either of them.</p>
    `},
    {type:'lesson', html:`
      <div class="lbl">What Just Happened <span class="tag tag-fact">Official Fact</span></div>
      <h4>Two Grassroots Doors, Not One</h4>
      <p>NSTC→STC→NCOE is SAI's own ladder. KIC→KISCE is the Khelo India scheme's ladder, State-administered with Central funding support. They are not competing programmes so much as parallel doors into the same broader system — a state with strong KIC/KISCE coverage can catch athletes that SAI's narrower, school-based NSTC scouting would miss, and vice versa.</p>
      <p><span class="tag tag-inf">Inference</span> The two ladders aren't hermetically sealed — a strong KISCE performer could plausibly be identified for an SAI-administered NCOE later, the way Sunita's and Arjun's paths could genuinely converge at elite level — but that specific crossover isn't something this project has verified as a formal, defined transition; treat it as a plausible connection, not a documented one.</p>
    `},
    {type:'takeaway', html:`<div class="lbl">Interview takeaway</div>If asked to distinguish a Khelo India Centre from a KISCE: KIC is the grassroots entry tier, KISCE is the more advanced tier — both State-administered under the Khelo India scheme, both distinct from SAI's own NSTC/STC/NCOE ladder, even though both ultimately serve the same national talent-development goal.</div>`}
  ]
},
{
  id:'ch2', title:'Selection', motif:'FOLLOW THE FILE',
  sections:[
    {type:'scene', html:`
      <div class="chnum">Chapter 2</div>
      <h2>Selection</h2>
      <p class="char">Six weeks later. A State Sports Department office, and a very different kind of room.</p>
      <p>Arjun's NSTC result didn't get him a phone call. It got him a line item on a spreadsheet that a State Sports Department official reviewed alongside forty other names, cross-checked against available seats at the nearest <b>SAI Training Centre</b>, and forwarded with a covering note. <span class="tag tag-fact">Official fact</span> STCs run junior-level development for ages 10–18, and admission follows placement criteria — competition rankings, not open enrolment — which is why the paperwork mattered as much as the stopwatch.</p>
      <p>Three states away, in an office that smelled of paper and instant coffee, an Assistant Director named Ritu Bhargava was reading a different file entirely — a quarterly report on STC seat utilisation across her assigned region. Arjun's name wasn't on it yet. But the seat he was about to fill was one of the numbers she'd been tracking for months, because an empty STC seat in a state with real athletic talent was, to her, a small administrative failure waiting to be explained.</p>
    `},
    {type:'lesson', html:`
      <div class="lbl">What Just Happened <span class="tag tag-fact">Official Fact</span> <span class="tag tag-illus">Illustrative Scenario</span></div>
      <h4>Two Institutions, Same Athlete</h4>
      <p>State Sports Departments are not SAI. They're separate government bodies that co-implement — especially at the grassroots and infrastructure level. Arjun's placement genuinely involves both: the State reviews and forwards; SAI's Operations Division ultimately administers the STC itself.</p>
      <p>Ritu's "seat utilisation report" is <span class="tag tag-illus">illustrative</span> — a plausible example of the monitoring and reporting duty in the AD's vacancy circular, not a document we've verified exists in that exact form. But the underlying fact is real: SAI's own Annual Report shows real STC capacity numbers (69 centres, thousands of athletes) that someone has to track against actual enrolment.</p>
    `},
    {type:'takeaway', html:`<div class="lbl">Interview takeaway</div>If asked "how does an athlete actually enter an STC," the honest answer isn't just "SAI selects them" — it's a State-level review feeding into an SAI-administered seat, which is exactly the kind of two-institution coordination an AD spends real time on.`}
  ]
},
{
  id:'ch3', title:'The Centre', motif:'FOLLOW THE ATHLETE',
  sections:[
    {type:'scene', html:`
      <div class="chnum">Chapter 3</div>
      <h2>The Centre</h2>
      <p class="char">Arjun's first week at the STC.</p>
      <p>The STC had a real track — Arjun's first — and a coach, Vikram Solanki, who ran a training log more rigorous than anything Arjun had known. Within a year, Vikram was telling anyone who'd listen that the boy had a genuine shot at something bigger. Within two, the paperwork agreed with him: Arjun's times qualified him for assessment at a <b>National Centre of Excellence</b>.</p>
      <p><span class="tag tag-fact">Official fact</span> NCOEs aren't simply "better STCs." They're SAI's high-performance layer — specialised training, sports-science backup, individualised nutrition, and multiple concurrent layers of prospective athletes so the national pool has depth, not just a single favourite. SAI's own materials describe 24 NCOEs as approved nationally; a separate Annual Report shows that in one recent year, only 22 were actually operational — a distinction Vikram, who'd coached at one of the non-operational ones early in his career, understood better than most people writing about sport ever would.</p>
    `},

      <svg viewBox="0 0 700 100" style="width:100%;">
        <rect x="0" y="30" width="150" height="40" rx="6" fill="var(--c-prog)"/><text x="75" y="55" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">NSTC</text>
        <line x1="150" y1="50" x2="185" y2="50" stroke="var(--gold)" stroke-width="2.5" marker-end="url(#a2)"/>
        <rect x="185" y="20" width="150" height="60" rx="6" fill="var(--c-prog)" opacity="0.9"/><text x="260" y="40" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">STC</text><text x="260" y="58" text-anchor="middle" fill="#fff" font-size="9">Arjun is here</text>
        <line x1="335" y1="50" x2="370" y2="50" stroke="var(--gold)" stroke-width="2.5" marker-end="url(#a2)"/>
        <rect x="370" y="10" width="150" height="80" rx="6" fill="var(--c-ad)"/><text x="445" y="45" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">NCOE</text><text x="445" y="62" text-anchor="middle" fill="#fff" font-size="9">assessment next</text>
        <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--gold)"/></marker></defs>
      </svg>`, caption:'Two years, two rungs up the pipeline.'},
    {type:'takeaway', html:`<div class="lbl">Interview takeaway</div>"Approved" and "operational" are not the same word. If a board asks how many NCOEs exist, the sharper answer distinguishes the two — 24 approved, 22 operational in the one year we can verify — rather than reciting a single confident number.`}
  ]
},
{
  id:'ch4', title:'The ₹50 Lakh Problem', motif:'FOLLOW THE FILE · FOLLOW THE MONEY',
  sections:[
    {type:'scene', html:`
      <div class="chnum">Chapter 4</div>
      <h2>The ₹50 Lakh Problem</h2>
      <p class="char">Arjun's NCOE. A cracked force-plate, and a coach's frustration.</p>
      <p>The NCOE's biomechanics lab had one force-plate system, and it had just failed a calibration check for the third time. Vikram, now training four athletes at national-junior level including Arjun, filed a technical requirement note: they needed a replacement system, and the one they wanted wasn't manufactured in India.</p>
      <p><span class="tag tag-illus">Illustrative scenario</span> The note went to D.K. Ramesh, the centre's administrator, who forwarded it as a formal proposal to SAI's Operations Division. From there it reached Ritu Bhargava's desk — not because she knew anything about force-plates, but because examining exactly this kind of file, checking budget heads, and flagging what needed to go where was, in the plainest terms, her job.</p>
      <p>Ritu's examination turned up two real complications. First, <span class="tag tag-fact">official fact</span> the Make-in-India requirement in Government procurement can restrict buying specialised equipment when no suitable domestic, BIS-certified product exists — which appeared to be the case here, and needed to be documented, not assumed. Second, the number itself — <span class="tag tag-fict">fictional</span> a shade over fifty lakh rupees — sat well above what the NCOE administrator could sanction alone, which meant Finance and GAD & Procurement both had a say before anyone placed an order.</p>
    `},
    {type:'lesson', html:`
      <div class="lbl">What Just Happened <span class="tag tag-illus">Illustrative Scenario</span> <span class="tag tag-fact">Official Fact</span></div>
      <h4>Where the Assistant Director Actually Sits</h4>
      <p>Notice what Ritu did <i>not</i> do: she didn't decide whether the force-plate was needed (a technical/coaching call), and she didn't personally approve the money (a Finance/delegated-authority call). What she did was the file-examination and coordination the vacancy circular actually describes — checking the proposal, flagging the Make-in-India issue, and routing it to the right divisions.</p>
    `},

{
  id:'ch5', title:'The Data That Follows You', motif:'FOLLOW THE FILE',
  sections:[
    {type:'scene', html:`
      <div class="chnum">Chapter 5</div>
      <h2>The Data That Follows You</h2>
      <p class="char">Eight months later. A dashboard, and a number that worried Vikram.</p>
      <p>Every session Arjun ran was now logged — splits, heart-rate recovery, force-plate output once the new system finally arrived — into <b>NSRS</b>, SAI's central sports data platform. <span class="tag tag-fact">Official fact</span> NSRS isn't just a filing cabinet; SAI's IT Division runs a genuine data-analytics and AI/ML function on top of it — athlete tracking, performance benchmarking, dashboards.</p>
      <p>It was that dashboard, not a coach's instinct, that first flagged something: Arjun's recovery numbers had quietly worsened over six weeks. Sports Science stepped in before Vikram would have noticed on his own. <span class="tag tag-illus">Illustrative</span> A minor training-load adjustment, not a crisis — but a real demonstration of what "digital infrastructure" concretely buys an athlete.</p>
    `},
    {type:'lesson', html:`
      <div class="lbl">What Just Happened <span class="tag tag-fact">Official Fact</span></div>
      <h4>Don't Say SAI Lacks Digital Infrastructure — It Doesn't</h4>
      <p>This scene exists specifically to counter a tempting but wrong interview answer: "I'd bring data-driven administration to SAI." SAI already runs it. The credible position — the one Arjun's story just demonstrated — is understanding and strengthening a system that's already catching real problems.</p>
      <p><span class="tag tag-inf">Inference</span> NIPFP's 2026 evaluation separately found that NSRS has real load/performance issues and a user-awareness gap in places — so "already exists" doesn't mean "already perfect." Both things are true at once.</p>
    `}
  ]

      <div class="chnum">Chapter 6</div>
      <h2>Podium Track</h2>
      <p class="char">Arjun, now nineteen, after a strong result at a national meet.</p>
      <p>A national medal changes the paperwork faster than it changes anything else. Within weeks, Vikram was helping prepare a proposal for <b>TOPS</b> — the Target Olympic Podium Scheme — Arjun's file moving to the <b>Mission Olympic Cell</b>, chaired by the Director General of SAI, for review alongside proposals for a dozen other athletes across sports.</p>
      <p><span class="tag tag-fact">Official fact</span> The MOC's actual functions are concrete: approve a customised training programme, recommend financial disbursement, monitor progress, and keep the paperwork straight. That disbursement, when it came, was financed in part through the <b>National Sports Development Fund</b> — a blend of Government money and private/CSR contributions, not a pure Government budget line.</p>
      <p><span class="tag tag-inf">Unconfirmed, deliberately not stated as fact</span> Nobody in this story claims the MOC meets on any particular schedule — because no verified source says so, and Ritu, watching the file move past her desk on its way upward, wouldn't have guessed either.</p>

{
  id:'ch7', title:'A Federation Under Question', motif:'FOLLOW THE ACCOUNTABILITY',
  sections:[
    {type:'scene', html:`
      <div class="chnum">Chapter 7</div>
      <h2>A Federation Under Question</h2>
      <p class="char">A governance story that has nothing to do with Arjun's training, and everything to do with whether he'll get to compete.</p>
      <p><span class="tag tag-fict">Fictional scenario</span> "The Federation" governing Arjun's sport had, for over a year, failed to hold the elections its own constitution required. Athletes were starting to ask whether a national team selected under a lapsed governance structure would even be recognised internationally.</p>
      <p>This is where the story deliberately leaves SAI's building entirely. <span class="tag tag-fact">Official fact</span> under the <b>National Sports Governance Act, 2025</b>, "the Federation" is what the Act calls a <b>National Sports Body</b> — a defined category covering the National Olympic Committee, National Paralympic Committee, NSFs, and Regional Sports Federations. Recognition, suspension, and governance standards for these bodies are the <b>National Sports Board's</b> job, not SAI's.</p>
      <p>Ritu heard about the situation the way most SAI staff would — secondhand, through athlete concern, not through any file on her desk. It genuinely wasn't hers to fix. <span class="tag tag-illus">Illustrative</span> If the Federation's recognition were suspended, SAI's own athlete-support schemes for that sport could be affected indirectly — but the actual governance dispute belonged entirely to a different regulatory chain.</p>
    `},
    {type:'lesson', html:`
      <div class="lbl">What Just Happened <span class="tag tag-fact">Official Fact</span></div>
      <h4>Two Chains, Still Not Merged</h4>
      <p>This is the single most commonly confused relationship in the whole subject, restated through a scene instead of a diagram: SAI trains and supports athletes. The National Sports Board governs and recognises the federations. They intersect — an athlete's competition eligibility can depend on both — but neither runs the other.</p>
    `},
    {type:'takeaway', html:`<div class="lbl">Interview takeaway</div>"NSGA-2025 doesn't replace or absorb SAI. It's a separate statutory governance layer for National Sports Bodies — the Federation in this story is exactly that kind of body. The two chains only intersect where a body's governance status could affect its athletes' SAI-linked programmes."`}
  ]
},
{
  id:'ch7b', title:'The Selection That Was Challenged', motif:'FOLLOW THE ACCOUNTABILITY',
  sections:[
    {type:'scene', html:`
      <div class="chnum">Chapter 7B</div>
      <h2>The Selection That Was Challenged</h2>
      <p class="char">Months into the Federation's governance dispute. A different kind of file, in a different building entirely.</p>
      <p><span class="tag tag-fict">Fictional scenario</span> Farhan Aziz, a senior athlete in Arjun's sport, was left out of a national team announced by the Federation's outgoing, term-lapsed committee. Farhan believed the selection trials had been run unfairly — not a governance-recognition question for the National Sports Board, but a dispute about a specific decision affecting a specific athlete.</p>
      <p><span class="tag tag-fact">Official fact</span> This is exactly the kind of matter the <b>National Sports Tribunal</b> exists for. Where the National Sports Board asks "is this Federation governed properly, and should it stay recognised," the Tribunal asks a narrower, sharper question: "was this specific decision — a selection, a disciplinary action, an eligibility call — correctly made." Farhan's case went to the Tribunal, not the Board.</p>
      <p>Ritu heard about this dispute the same secondhand way she'd heard about the Federation's lapsed elections — and this time, even more clearly, it had nothing to do with her desk. <span class="tag tag-illus">Illustrative</span> No SAI file crossed her table because of it; no SAI division was party to it. The Tribunal's jurisdiction sat entirely outside SAI's administrative machinery, the same way a civil court case wouldn't route through a government office simply because a government employee found it interesting.</p>
    `},
    {type:'lesson', html:`
      <div class="lbl">What Just Happened <span class="tag tag-fact">Official Fact</span></div>
      <h4>Recognition vs. Disputes — Two Different Questions, Two Different Bodies</h4>
      <p>Chapter 7 showed the National Sports Board's function: governance standards, recognition, suspension of National Sports Bodies as institutions. This chapter shows the National Sports Tribunal's separate function: resolving specific disputes — selection, disciplinary, eligibility — brought by individuals or bodies. Both sit under the NSGA-2025 framework; neither sits inside SAI, and neither handles SAI's own internal administrative files.</p>
      <p><span class="tag tag-inf">Inference</span> The story doesn't specify Farhan's case outcome — the Tribunal's actual procedures and typical case timelines aren't independently verified in this project's source material, so the story stops at "the case went to the Tribunal" rather than inventing a verdict or a process it can't back up.</p>
    `},
    {type:'takeaway', html:`<div class="lbl">Interview takeaway</div>Don't let "governance dispute" become one undifferentiated bucket. A Federation's recognition/compliance status is an NSB matter; a specific selection or disciplinary dispute is an NST matter. Neither is something an Assistant Director at SAI would be asked to resolve — but knowing which body handles which is exactly the kind of precision a board question is likely to probe.</div>`}
  ]
},
{
  id:'ch8', title:'Who Is Watching', motif:'FOLLOW THE ACCOUNTABILITY',
  sections:[
    {type:'scene', html:`
      <div class="chnum">Chapter 8</div>
      <h2>Who Is Watching</h2>
      <p class="char">A Parliamentary Committee report lands on desks nobody expected it to reach.</p>
      <p><span class="tag tag-fact">Official fact</span> The 369th Parliamentary Standing Committee report on SAI and Khelo India — a real document, presented in August 2025 — found roughly 45% of SAI's sanctioned posts vacant nationally, and recommended filling them within six months. It also raised concerns about how National Sports Development Fund money had, in some instances, been used.</p>
      <p>None of this was about Arjun, or his NCOE, or Ritu's desk specifically. But <span class="tag tag-illus">illustrative</span> Ritu's own division received a circular the following month asking every Regional Centre to report current staffing against sanctioned strength — a plausible, if invented, downstream effect of exactly this kind of oversight finding.</p>
      <p>A separate, independent evaluation — NIPFP's, from January 2026 — had already found something related but distinct: state-by-state manpower gaps at Khelo India State Centres of Excellence, averaging 56% filled nationally, with wide variation between states. <span class="tag tag-inf">Discipline point</span> These are two different numbers, from two different bodies, measuring two different things. The story keeps them separate on purpose.</p>
    `},
    {type:'takeaway', html:`<div class="lbl">Interview takeaway</div>Don't merge the Parliamentary Committee's ~45% SAI-wide vacancy figure with NIPFP's 56% KISCE fill-rate figure under pressure — they're genuinely different populations, and conflating them is an easy, avoidable mistake.`}
  ]
},
{
  id:'ch9', title:"Ritu's Desk", motif:'FOLLOW THE DECISION',
  sections:[
    {type:'scene', html:`
      <div class="chnum">Chapter 9</div>
      <h2>Ritu's Desk</h2>
      <p class="char">An ordinary Tuesday. Not Arjun's story anymore — just Ritu's, in full.</p>
      <p><span class="tag tag-illus">Illustrative, composite day</span> By mid-morning, three files were open on Ritu's desk. One was a staffing report responding to the Parliamentary Committee's finding. One was a coordination request from a State Sports Department about a Khelo India Centre's delayed infrastructure grant. One was a routine APAR she needed to complete for a subordinate Section Officer.</p>
      <p>None of them required her to know anything about biomechanics, or middle-distance pacing, or force-plates. All three asked the same underlying questions, in different clothes: <i>What exactly is the issue? Which division or function owns it? What rules apply? What evidence is on file? Who else needs consulting? Is this mine to decide, or does it need to go up?</i></p>
      <p>The infrastructure grant, she could clear herself — the delay was a documentation gap, not a policy question, and resolving it was squarely within what she'd been delegated. The staffing report, she couldn't decide alone; she wrote a recommendation and sent it up with the numbers attached, clearly labelled as a recommendation, not a decision. The APAR, she simply did, because supervision was not a special event — it was Tuesday.</p>
    `},
    {type:'lesson', html:`
      <div class="lbl">What Just Happened <span class="tag tag-illus">Illustrative, but structurally accurate</span></div>
      <h4>The Eleven Duties, Lived In</h4>
      <p>Every one of the vacancy circular's eleven duties just happened in one invented morning: policy implementation (acting on the Committee's finding), supervision (the APAR), file examination and decision support (all three files), coordination (the State liaison), monitoring and reporting (the staffing numbers), and the constant, quiet judgment call of knowing which of those is actually hers to decide.</p>
    `},
    {type:'takeaway', html:`<div class="lbl">Interview takeaway</div>"What would you do in your first 90 days?" doesn't need a grand plan as an answer. It needs this: learn which of these three-file mornings looks like, in this specific organisation, before trusting your own judgment on anything sport-specific.`}
  ]
},

      <div class="chnum">Final Chapter</div>
      <h2>The Whole Map</h2>
      <p>Arjun never met Ritu. He never will — that's realistic, not a plot gap. But every stage of his story ran through a system she was one small, real part of administering: NSTC brought him in, while a parallel Khelo India door brought Sunita in a different way; a State Department and SAI's Operations Division moved him through STC; an NCOE gave him a real shot at excellence, and needed a working force-plate to do it properly; NSRS caught a training problem before a human did; TOPS and the Mission Olympic Cell backed him once he'd earned it, financed in part through NSDF; a completely separate governance chain — NSGA, the National Sports Board — decided whether his own federation could even field a team, while the National Sports Tribunal handled a specific selection dispute that the Board never touched; and Parliament, NIPFP, and the ordinary machinery of audit and reporting quietly checked whether all of it was working as intended.</p>
      <p>Ritu's job was never to be the hero of any single one of those stages. It was to be the person who kept files moving correctly through all of them.</p>

    const lines = n.label.split('\n');
    const ty = n.y + n.h/2 - (lines.length-1)*7;
    let texts = lines.map((l,i)=>`<text x="${n.x+n.w/2}" y="${ty+i*14}" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">${l}</text>`).join('');
    nodes += `<g class="mapnode" onclick="jumpToChapterById('${n.chapterId}')">
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="7" fill="${n.color}"/>
      ${texts}
    </g>`;
  });
  return `<svg viewBox="0 0 720 350" style="width:100%;">${nodes}</svg>`;
}

function jumpToChapterById(id){
  const idx = chapterIdxById(id);
  if(idx>=0) openChapter(idx);
}

const SKEY='sai_story_v1';
function loadS(){ try{return JSON.parse(localStorage.getItem(SKEY))||{completed:{}, last:0, homeView:'chapters'};}catch(e){return {completed:{}, last:0, homeView:'chapters'};} }
function saveS(s){ try{localStorage.setItem(SKEY, JSON.stringify(s));}catch(e){} }
let S = loadS();
let currentIdx = S.last || 0;

function renderProgress(){
  const done = Object.keys(S.completed).length;
  document.getElementById('progFill').style.width = Math.round(100*done/CHAPTERS.length)+'%';
}

function setHomeView(v){
  S.homeView = v; saveS(S);
  renderHome();
}

function renderHome(){
  currentIdx = -1;
  const view = S.homeView || 'chapters';
  const main = document.getElementById('main');
  let html = `<div class="home-hero">
    <h1>The Long Run</h1>
    <p>A fictional runner, a real Assistant Director, and every institution in the SAI–MYAS system, told as one connected story. Follow the athlete, the file, the money, the decision, and the accountability — pick up wherever you left off, or explore by institution on the Campus Map.</p>
  </div>
  <div class="viewtoggle">
    <button class="${view==='chapters'?'active':''}" onclick="setHomeView('chapters')">Chapters</button>
    <button class="${view==='map'?'active':''}" onclick="setHomeView('map')">Campus Map</button>
  </div>`;

  if(view==='map'){
    html += `<div class="mapwrap">
      <p class="intro">Tap any location to jump straight to the chapter where it's actually covered — this isn't a decorative diagram, each node opens real content.</p>
      <div class="maplegend">
        <span>Government/SAI</span><span>Programmes</span><span>Finance</span><span>AD</span><span>NSGA governance</span><span>Oversight</span>
      </div>
      ${renderMapSVG()}
      <div class="mapcaption">Institutions shown are the ones that actually appear in the story — not an exhaustive org chart.</div>
    </div>`;
  } else {
    html += `<div class="chlist">`;
    CHAPTERS.forEach((ch,i)=>{
      html += `<div class="chrow" onclick="openChapter(${i})">
        <div><div class="ct">${i===0?'':i+'. '}${ch.title}</div><div class="cs">${ch.motif || (i===0?'Prologue':'Finale')}</div></div>
        ${S.completed[ch.id]?'<span class="done">✓</span>':''}
      </div>`;
    });
    html += `</div>`;
  }

  html += `<a class="quizlink" href="../09-audio/index.html">Listening Room →</a><a class="quizlink" href="../quiz/index.html">Recall Bench (quiz) →</a>`;
  main.innerHTML = html;
  renderProgress();
}

function openChapter(i){
  currentIdx = i;
  S.last = i; saveS(S);
  const ch = CHAPTERS[i];
  const main = document.getElementById('main');
  let html = '';
  if(ch.motif) html += `<div class="scene"><span class="motif">${ch.motif}</span></div>`;
  ch.sections.forEach(sec=>{
    if(sec.type==='scene') html += `<div class="scene">${sec.html}</div>`;
    else if(sec.type==='lesson') html += `<div class="lesson">${sec.html}</div>`;
    else if(sec.type==='takeaway') html += `<div class="takeaway">${sec.html}</div>`;
    else if(sec.type==='diagram') html += `<div class="diagwrap">${sec.svg}<div class="cap">${sec.caption}</div></div>`;
    else if(sec.type==='cast'){
      html += `<div class="castgrid">` + CAST.map(c=>`<div class="castcard"><div class="n">${c.n}</div><div class="r">${c.r}</div><div class="d">${c.d}</div></div>`).join('') + `</div>`;
    }
  });
  html += `<div class="navrow">
    <button class="navbtn" onclick="renderHome()">← All chapters</button>
    <button class="navbtn primary" onclick="markDoneAndNext(${i})">${i<CHAPTERS.length-1? 'Mark read & continue →' : 'Mark read — finished'}</button>
  </div>`;
  main.innerHTML = html;
  window.scrollTo(0,0);
}

function markDoneAndNext(i){
  S.completed[CHAPTERS[i].id] = true; saveS(S);
  if(i < CHAPTERS.length-1) openChapter(i+1);
  else renderHome();
}

function openCast(){
  document.getElementById('castContent').innerHTML = `<div class="castgrid">` + CAST.map(c=>`<div class="castcard"><div class="n">${c.n}</div><div class="r">${c.r}</div><div class="d">${c.d}</div></div>`).join('') + `</div>`;
  document.getElementById('castModal').classList.add('show');
}
function closeCast(){ document.getElementById('castModal').classList.remove('show'); }

renderHome();
</script>
</body>
</html>
