<meta charset="UTF-8">

<title>SAI AD — Recall Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151A;
    --surface:#1B2027;
    --surface-2:#20262F;
    --line:#2E353F;
    --text:#EDEAE2;
    --text-dim:#9AA3AD;
    --gold:#C79A3D;
    --gold-dim:#8E6E2B;
    --green:#3F7A5D;
    --red:#B5493F;
    --radius:4px;
    --maxw:480px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;}
  body{ -webkit-font-smoothing:antialiased;}
  h1,h2,h3, .num, .btn, .tag{font-family:'Barlow Condensed', 'Arial Narrow', sans-serif;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  #app{max-width:var(--maxw); margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  header.top{
    padding:18px 18px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between;
  }
  header.top .brand{font-size:22px; font-weight:600; letter-spacing:0.2px;}
  header.top .brand small{display:block; font-family:'Source Sans 3'; font-size:12px; color:var(--text-dim); font-weight:400; margin-top:2px;}
  .scoreboard{display:flex; gap:14px; align-items:baseline;}
  .scoreboard .num{font-size:26px; color:var(--gold); line-height:1;}
  .scoreboard .lbl{font-size:11px; color:var(--text-dim); text-transform:lowercase;}

  main{flex:1; padding:16px 18px 40px;}

  .rule{border:none; border-top:2px solid var(--gold); width:36px; margin:0 0 14px;}

  /* Home grid */
  .modes{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  .mode-tile{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 12px; text-align:left; cursor:pointer; color:var(--text);
  }
  .mode-tile:active{background:var(--surface-2);}
  .mode-tile .t{font-size:19px; font-weight:600; line-height:1.05;}
  .mode-tile .d{font-size:12px; color:var(--text-dim); margin-top:6px; font-family:'Source Sans 3'; line-height:1.35;}
  .mode-tile .count{font-size:11px; color:var(--gold-dim); margin-top:8px;}

  section.intro{margin-bottom:6px;}
  section.intro p{color:var(--text-dim); font-size:13.5px; line-height:1.5; margin:0 0 4px;}

  /* Session view */
  .session-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .back{background:none; border:none; color:var(--text-dim); font-family:'Source Sans 3'; font-size:13px; cursor:pointer; padding:6px 0;}
  .progress{font-size:12px; color:var(--text-dim); font-family:'Source Sans 3';}

  .timerwrap{margin-bottom:16px;}
  .timerbar{height:3px; background:var(--line); border-radius:2px; overflow:hidden;}
  .timerbar > div{height:100%; background:var(--gold); width:100%; transform-origin:left;}
  .timernum{font-size:34px; color:var(--gold); margin-top:6px;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px 18px;}
  .card .tag{font-size:12px; color:var(--gold-dim); margin-bottom:8px; display:block;}
  .card .prompt{font-size:19px; line-height:1.35; font-family:'Source Sans 3'; font-weight:500;}
  .card .answer{margin-top:16px; padding-top:16px; border-top:1px dashed var(--line);}
  .card .answer .a-main{font-size:20px; color:var(--gold); font-family:'Barlow Condensed'; font-weight:600; margin-bottom:6px;}
  .card .answer .a-detail{font-size:13.5px; color:var(--text-dim); line-height:1.5;}

  .mcq-options{display:flex; flex-direction:column; gap:8px; margin-top:16px;}
  .mcq-opt{
    background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius);
    padding:11px 13px; font-size:14.5px; color:var(--text); text-align:left; cursor:pointer; font-family:'Source Sans 3';
  }
  .mcq-opt.correct{border-color:var(--green); background:rgba(63,122,93,0.18);}
  .mcq-opt.wrong{border-color:var(--red); background:rgba(181,73,63,0.18);}
  .mcq-opt:disabled{opacity:0.6;}

  .actions{display:flex; gap:10px; margin-top:18px;}
  .btn{
    flex:1; padding:13px 10px; border-radius:var(--radius); border:1px solid var(--line);
    background:var(--surface-2); color:var(--text); font-size:16px; font-weight:600; cursor:pointer;
  }
  .btn.primary{background:var(--gold); color:#1a1408; border-color:var(--gold);}
  .btn.got{border-color:var(--green); color:var(--green); background:rgba(63,122,93,0.1);}
  .btn.missed{border-color:var(--red); color:var(--red); background:rgba(181,73,63,0.1);}

  /* Summary */
  .summary .num{font-size:52px; color:var(--gold); line-height:1;}
  .summary .sub{color:var(--text-dim); font-size:13px; margin-top:2px;}
  .sumrow{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .sumrow .k{color:var(--text-dim);}
  .review-list{margin-top:14px;}
  .review-item{padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .review-item .rp{color:var(--text-dim); font-size:12px; margin-top:2px;}

  .empty{color:var(--text-dim); font-size:14px; padding:20px 0; line-height:1.5;}

  footer.note{padding:12px 18px 24px; color:var(--text-dim); font-size:11px; text-align:center; border-top:1px solid var(--line);}
</style>
</head>

  {id:'b5', q:'Tell us one administrative failure in SAI and what you would do about it.', pts:['Use a documented finding, not a guess — e.g. NCOE approved-vs-operational gap, or KISCE manpower gap','Describe a realistic AD-level response: monitor, escalate, coordinate — not a sweeping fix','Show judgement, not blame']},
  {id:'b6', q:'What would you do if your superior rejected your recommendation?', pts:['Understand the reasoning first, don\'t assume you were right','Government hierarchy: recommendation vs decision-making authority are different things','Re-examine if new information changes the recommendation; otherwise, respect the decision post-explanation']},
  {id:'b7', q:'How would you handle an athlete/coach/NSF demanding something outside the rules?', pts:['Acknowledge the request seriously, don\'t dismiss it','Explain the rule/compliance boundary clearly','Escalate through proper channel if there\'s a genuine gap worth raising, rather than bending the rule']},
  {id:'b8', q:'Why deputation to SAI at this stage of your career?', pts:['Genuine test of responsibility in a new domain','Mission-facing framing: contributing to athletes\' outcomes, not personal convenience','Avoid location-preference or personal-lifestyle reasoning out loud']},
  {id:'b9', q:'If selected, what would you need to learn first?', pts:['SAI\'s actual operating environment before trusting your own judgement on sports-specific calls','Specific domain gaps: sports science, coaching structures, scheme mechanics','Frame as deliberate, bounded learning — not open-ended uncertainty']},
];

/* ============ STATE / STORAGE ============ */
const STORE_KEY = 'sai_recall_v1';
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {items:{}, totalReviewed:0, streak:0, lastDay:null}; }
  catch(e){ return {items:{}, totalReviewed:0, streak:0, lastDay:null}; }
}
function saveStore(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
let store = loadStore();

function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const t = todayStr();
  if(store.lastDay === t) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  store.streak = (store.lastDay === y) ? store.streak+1 : 1;
  store.lastDay = t;
}
function recordItem(id, gotIt){
  if(!store.items[id]) store.items[id] = {attempts:0, misses:0};
  store.items[id].attempts++;
  if(!gotIt) store.items[id].misses++;
  store.totalReviewed++;
  bumpStreak();
  saveStore(store);
  renderHeader();
}
function missRate(id){
  const it = store.items[id];
  if(!it || it.attempts===0) return 0;
  return it.misses/it.attempts;
}
function renderHeader(){
  document.getElementById('hdrStreak').textContent = store.streak||0;
  document.getElementById('hdrTotal').textContent = store.totalReviewed||0;
}

/* ============ SESSION ENGINE ============ */
let session = null; // {items, idx, results:[], mode, timerSeconds}

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function startSession(mode, items, opts={}){
  session = {mode, items: shuffle(items).slice(0, opts.limit||items.length), idx:0, results:[], timerSeconds: opts.timerSeconds||null};
  renderSession();
}

function weakestItems(pool, n){
  return [...pool].sort((a,b)=> missRate(b.id)-missRate(a.id) || (store.items[b.id]?.attempts||0)-(store.items[a.id]?.attempts||0)).slice(0,n);
}

function renderSession(){
  const main = document.getElementById('main');
  if(session.idx >= session.items.length){ renderSummary(); return; }
  const item = session.items[session.idx];
  const isTrap = TRAPS.includes(item);
  const isTimed = session.timerSeconds != null;

  let html = `<div class="session-top">
    <button class="back" onclick="goHome()">← modes</button>
    <div class="progress">${session.idx+1} / ${session.items.length}</div>
  </div>`;

  if(isTimed){
    html += `<div class="timerwrap"><div class="timernum" id="timerNum">${session.timerSeconds}</div>
      <div class="timerbar"><div id="timerFill"></div></div></div>`;
  }

  html += `<div class="card">
    <span class="tag">${item.cat || 'Board Pressure'}</span>
    <div class="prompt">${item.q}</div>`;

  if(isTrap){
    html += `<div class="mcq-options" id="mcqWrap">`;
    item.opts.forEach((o,i)=>{
      html += `<button class="mcq-opt" onclick="answerTrap(${i})">${o}</button>`;
    });
    html += `</div>`;
  } else if(item.pts){
    // Board pressure / open recall
    html += `<div class="answer" id="answerBox" style="display:none;">
      <div class="a-detail">${item.pts.map(p=>'• '+p).join('<br>')}</div>
    </div>
    <div class="actions" id="revealActions">
      <button class="btn primary" onclick="revealOpen()">Reveal expected points</button>
    </div>
    <div class="actions" id="gradeActions" style="display:none;">
      <button class="btn got" onclick="gradeOpen(true)">I covered this</button>
      <button class="btn missed" onclick="gradeOpen(false)">I missed points</button>
    </div>`;
  } else {
    html += `<div class="answer" id="answerBox" style="display:none;">
      <div class="a-main">${item.a}</div>
      ${item.d ? `<div class="a-detail">${item.d}</div>` : ''}
    </div>
    <div class="actions" id="revealActions">
      <button class="btn primary" onclick="revealOpen()">Show answer</button>
    </div>
    <div class="actions" id="gradeActions" style="display:none;">
      <button class="btn got" onclick="gradeOpen(true)">Got it</button>
      <button class="btn missed" onclick="gradeOpen(false)">Missed it</button>
    </div>`;
  }
  html += `</div>`;
  main.innerHTML = html;

  if(isTimed) startTimer(session.timerSeconds);
}

let timerInterval = null;
function startTimer(seconds){
  clearInterval(timerInterval);
  let remaining = seconds;
  const numEl = document.getElementById('timerNum');
  const fillEl = document.getElementById('timerFill');
  fillEl.style.transition = `transform ${seconds}s linear`;
  requestAnimationFrame(()=>{ fillEl.style.transform = 'scaleX(0)'; });
  timerInterval = setInterval(()=>{
    remaining--;
    if(numEl) numEl.textContent = Math.max(remaining,0);
    if(remaining<=0){ clearInterval(timerInterval); }
  },1000);
}

function revealOpen(){
  clearInterval(timerInterval);
  document.getElementById('answerBox').style.display='block';
  document.getElementById('revealActions').style.display='none';
  document.getElementById('gradeActions').style.display='flex';
}
function gradeOpen(gotIt){
  const item = session.items[session.idx];
  recordItem(item.id, gotIt);
  session.results.push({id:item.id, gotIt});
  session.idx++;
  renderSession();
}
function answerTrap(choiceIdx){
  const item = session.items[session.idx];
  const buttons = document.querySelectorAll('#mcqWrap .mcq-opt');
  buttons.forEach((b,i)=>{
    b.disabled = true;
    if(i===item.correct) b.classList.add('correct');
    else if(i===choiceIdx) b.classList.add('wrong');
  });
  const gotIt = choiceIdx===item.correct;
  recordItem(item.id, gotIt);
  session.results.push({id:item.id, gotIt});
  setTimeout(()=>{ session.idx++; renderSession(); }, 1100);
}

function renderSummary(){
  const main = document.getElementById('main');
  const got = session.results.filter(r=>r.gotIt).length;
  const total = session.results.length;

  // strong/weak by category
  const byCat = {};
  session.items.forEach((item,i)=>{
    const cat = item.cat || 'Board Pressure';
    if(!byCat[cat]) byCat[cat] = {got:0, total:0};
    byCat[cat].total++;
    if(session.results[i] && session.results[i].gotIt) byCat[cat].got++;
  });
  const catRates = Object.entries(byCat).map(([cat,v])=>({cat, rate:v.got/v.total}));
  catRates.sort((a,b)=>b.rate-a.rate);
  const strong = catRates.slice(0,2).map(c=>c.cat).join(', ') || '—';
  const weak = catRates.slice(-2).map(c=>c.cat).join(', ') || '—';

  const missed = session.items.filter((item,i)=> session.results[i] && !session.results[i].gotIt);

  let html = `<div class="session-top"><button class="back" onclick="goHome()">← modes</button><div></div></div>
  <div class="summary">
    <div class="num">${got}/${total}</div>
    <div class="sub">this session</div>
    <div class="sumrow"><span class="k">Strong</span><span>${strong}</span></div>
    <div class="sumrow"><span class="k">Weak</span><span>${weak}</span></div>
  </div>`;

  if(missed.length){
    html += `<div class="review-list"><h3 style="font-size:16px; margin-bottom:4px;">Review these ${missed.length} tomorrow</h3>`;
    missed.forEach(item=>{
      html += `<div class="review-item">${item.q}<div class="rp">${item.a || (item.opts ? item.opts[item.correct] : '')}</div></div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="empty">Clean sweep — nothing flagged for review from this set.</div>`;
  }

  html += `<div class="actions" style="margin-top:20px;"><button class="btn primary" onclick="goHome()">Done</button></div>`;
  main.innerHTML = html;
}

/* ============ HOME ============ */
function goHome(){
  clearInterval(timerInterval);
  session = null;
  renderHome();
}

function renderHome(){
  const main = document.getElementById('main');
  const weakCount = ALL_RECALL.filter(i=>missRate(i.id) > 0.34 && (store.items[i.id]?.attempts||0) >= 1).length;

  main.innerHTML = `
    <hr class="rule">
    <section class="intro"><p>Pick a mode. Every mode works the same way: recall it in your head (or aloud), then reveal and grade yourself honestly — the point is testing retrieval, not browsing answers.</p></section>
    <div class="modes">
      <button class="mode-tile" onclick="modeQuick10()">
        <div class="t">Quick 10</div>
        <div class="d">Five-minute mixed drill across everything.</div>
        <div class="count">10 items</div>
      </button>
      <button class="mode-tile" onclick="modeCategory('Facts')">
        <div class="t">Facts Recall</div>
        <div class="d">Numbers, statistics, figures.</div>
        <div class="count">${FACTS.length} items</div>
      </button>
      <button class="mode-tile" onclick="modeCategory('Abbrev')">
        <div class="t">Abbreviation Drill</div>
        <div class="d">Full form + why it matters.</div>
        <div class="count">${ABBR.length} items</div>
      </button>
      <button class="mode-tile" onclick="modeCategory('Divisions')">
        <div class="t">SAI Divisions</div>
        <div class="d">Function ↔ division recognition.</div>
        <div class="count">${DIVISIONS.length} items</div>
      </button>
      <button class="mode-tile" onclick="modeModules()">
        <div class="t">Module Recall</div>
        <div class="d">What / why / how / broken / AD fit — for each module.</div>
        <div class="count">${MODULES.length} modules</div>
      </button>
      <button class="mode-tile" onclick="modeTraps()">
        <div class="t">Fact Traps</div>
        <div class="d">Judgment calls on unresolved or risky claims.</div>
        <div class="count">${TRAPS.length} items</div>
      </button>
      <button class="mode-tile" onclick="modeWeak()">
        <div class="t">Weak Areas</div>
        <div class="d">Auto-picks what you keep missing.</div>
        <div class="count">${weakCount} flagged</div>
      </button>
      <button class="mode-tile" onclick="modeBoardPressure()">
        <div class="t">Board Pressure</div>
        <div class="d">Timed. No multiple choice. Real board questions.</div>
        <div class="count">${BOARD_QS.length} scenarios</div>
      </button>
      <button class="mode-tile" onclick="modeExplainAloud()">
        <div class="t">Explain It Aloud</div>
        <div class="d">30–60s to answer verbally before reveal.</div>
        <div class="count">${MODULES.length + FACTS.length} topics</div>
      </button>
    </div>
  `;
  renderHeader();
}

function modeQuick10(){ startSession('quick10', shuffle([...ALL_RECALL, ...TRAPS]), {limit:10}); }
function modeCategory(catKey){
  const map = {Facts:FACTS, Abbrev:ABBR, Divisions:DIVISIONS};
  startSession('cat', map[catKey]);
}
function modeModules(){ startSession('modules', MODULES); }
function modeTraps(){ startSession('traps', TRAPS); }
function modeWeak(){
  const pool = ALL_RECALL.filter(i => (store.items[i.id]?.attempts||0) >= 1);
  const weak = weakestItems(pool.length? pool : ALL_RECALL, 10);
  startSession('weak', weak);
}
function modeBoardPressure(){ startSession('board', BOARD_QS, {timerSeconds:45}); }
function modeExplainAloud(){ startSession('explain', shuffle([...MODULES]), {timerSeconds:45}); }

/* ============ INIT ============ */
renderHome();
</script>
</body>
</html>
